name: root-witness
on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: root-witness
  cancel-in-progress: false
jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cosign public chain anchor (零钥;公锚raw直读;独立仓见证)
        run: |
          python3 - <<'PYEOF'
          import json,datetime,urllib.request,hashlib
          ts=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          anch=None
          try:
              anch=json.loads(urllib.request.urlopen('https://raw.githubusercontent.com/chepin-ai/vci-inbox/main/bridge/chain-anchor.json',timeout=15).read().decode())
          except Exception as e:
              print('anchor unreachable',e); raise SystemExit(1)
          wit={'witness':'vci-root/root-witness','ts':ts,'anchor':anch,
               'witness_sha256':hashlib.sha256(json.dumps(anch,sort_keys=True,ensure_ascii=False).encode()).hexdigest()}
          json.dump(wit,open('witness-latest.json','w'),ensure_ascii=False,indent=1)
          print(json.dumps({'size':anch.get('size'),'wit':wit['witness_sha256'][:12]}))
          PYEOF
      - name: commit witness
        run: |
          git config user.name root-witness; git config user.email witness@vci-root.local
          git add witness-latest.json
          git commit -m "witness: anchor cosign $(date -u +%Y%m%d-%H%M) [skip ci]" -q || echo noop
          git push -q
